<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal MTQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #065f46 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.97);
        }
        .input-group {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }
        .input-field {
            padding-left: 46px;
        }
        .btn-login {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(4, 120, 87, 0.3);
        }
        .loading {
            display: none;
        }
        .loading.active {
            display: inline-block;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    
    <!-- Login Card -->
    <div class="login-card w-full max-w-md rounded-3xl shadow-2xl p-8 border border-white/20">
        
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-emerald-600 to-emerald-800 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg border-2 border-amber-400">
                <span class="material-symbols-outlined text-amber-300 text-5xl">mosque</span>
            </div>
            <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 font-bold text-[10px] uppercase tracking-widest rounded-full mb-2">
                Musabaqah Tilawatil Quran
            </span>
            <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Portal MTQ</h1>
            <p class="text-gray-500 text-sm mt-1 font-medium">Sistem Pertemuan & Absensi Peserta</p>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            
            <!-- Email / Username Input -->
            <div class="input-group">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">Username / Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined input-icon">person</span>
                    <input 
                        type="text" 
                        id="email" 
                        required 
                        placeholder="admin atau admin@mtq.id" 
                        class="w-full px-4 py-3 input-field border border-gray-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
                    >
                </div>
            </div>
            
            <!-- Password Input -->
            <div class="input-group">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined input-icon">lock</span>
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        placeholder="••••••••" 
                        class="w-full px-4 py-3 input-field border border-gray-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
                    >
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium text-center"></div>
            
            <!-- Submit Button -->
            <button 
                type="submit" 
                id="btnSubmit"
                class="w-full btn-login text-white py-3.5 rounded-xl font-bold text-sm tracking-wide shadow-md flex items-center justify-center gap-2"
            >
                <span class="material-symbols-outlined text-[18px]">login</span>
                <span>MASUK PORTAL</span>
                <span class="loading material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
            </button>
        </form>

        <!-- Footer Info -->
        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-400">
                Default Akun Admin: <strong class="text-gray-700">admin</strong> / <strong class="text-gray-700">admin123</strong>
            </p>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnSubmit');
            const errDiv = document.getElementById('errorMessage');
            const loading = btn.querySelector('.loading');

            errDiv.classList.add('hidden');
            btn.disabled = true;
            loading.classList.add('active');

            // Quick default fallback for client-side check if backend unreachable or default
            if (email === 'admin' && password === 'admin123') {
                setTimeout(() => {
                    window.top.location.href = '<?= scriptUrl ?>?page=dashboard';
                }, 500);
                return;
            }

            google.script.run
                .withSuccessHandler(res => {
                    btn.disabled = false;
                    loading.classList.remove('active');
                    if (res && res.success) {
                        window.top.location.href = '<?= scriptUrl ?>?page=dashboard';
                    } else {
                        errDiv.textContent = res ? res.message : 'Username atau password salah.';
                        errDiv.classList.remove('hidden');
                    }
                })
                .withFailureHandler(err => {
                    btn.disabled = false;
                    loading.classList.remove('active');
                    errDiv.textContent = 'Terjadi kesalahan koneksi ke server.';
                    errDiv.classList.remove('hidden');
                })
                .login(email, password);
        }
    </style>
</body>
</html>
