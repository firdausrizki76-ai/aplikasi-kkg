<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal MTQ - Musabaqah Tilawatil Quran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="pages.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        #reader { background-color: black !important; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
        #reader video { object-fit: cover !important; }
        .scan-status { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translate(-50%, -20px); opacity: 0; pointer-events: none; }
        .scan-status.active { transform: translate(-50%, 0); opacity: 1; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="app"></div>

    <!-- Status Toast -->
    <div id="statusToast" class="scan-status fixed top-6 left-1/2 z-[100] w-[88%] max-w-sm p-4 rounded-2xl shadow-2xl border-2 flex items-center gap-4">
        <div id="statusIcon" class="w-11 h-11 rounded-full flex items-center justify-center shrink-0 shadow-sm"></div>
        <div class="flex-1">
            <p id="statusTitle" class="font-bold text-sm leading-tight tracking-tight"></p>
            <p id="statusMsg" class="text-[10px] opacity-90 font-semibold mt-0.5"></p>
        </div>
    </div>

    <!-- Area untuk Print ID Card -->
    <div id="printArea" class="hidden"></div>

    <script>
        const API_URL = '/api/proxy';

        const google = {
            script: {
                run: {
                    withSuccessHandler: function(cb) { this._success = cb; return this; },
                    withFailureHandler: function(cb) { this._failure = cb; return this; },
                    _call: async function(action, args) {
                        try {
                            const url = new URL(window.location.origin + API_URL);
                            url.searchParams.append('action', action);
                            if (args.length > 0 && typeof args[0] === 'object') {
                                Object.keys(args[0]).forEach(k => url.searchParams.append(k, args[0][k]));
                            }
                            const res = await fetch(url);
                            const data = await res.json();
                            if (this._success) this._success(data);
                        } catch (e) { console.error(e); if (this._failure) this._failure(e); }
                    },
                    login: function(...a) { this._call('login', a); },
                    getKegiatanAktif: function(...a) { this._call('getKegiatanAktif', a); },
                    getListKegiatan: function(...a) { this._call('getListKegiatan', a); },
                    simpanKegiatan: function(...a) { this._call('simpanKegiatan', a); },
                    hapusKegiatan: function(...a) { this._call('hapusKegiatan', a); },
                    aktifkanKegiatan: function(...a) { this._call('aktifkanKegiatan', a); },
                    getDashboardStats: function(...a) { this._call('getDashboardStats', a); },
                    getListPeserta: function(...a) { this._call('getListPeserta', a); },
                    simpanPeserta: function(...a) { this._call('simpanPeserta', a); },
                    hapusPeserta: function(...a) { this._call('hapusPeserta', a); },
                    importPesertaExcel: function(...a) { this._call('importPesertaExcel', a); },
                    getDaftarHadir: function(...a) { this._call('getDaftarHadir', a); },
                    getLaporan: function(...a) { this._call('getLaporan', a); },
                    prosesScan: function(...a) { this._call('prosesScan', a); },
                    simpanEditStatus: function(...a) { this._call('simpanEditStatus', a); }
                }
            }
        };

        function getLocalDate() {
            const now = new Date();
            const offset = now.getTimezoneOffset();
            const local = new Date(now.getTime() - (offset * 60 * 1000));
            return local.toISOString().split('T')[0];
        }

        function showStatus(success, title, msg) {
            const toast = document.getElementById('statusToast');
            const icon = document.getElementById('statusIcon');
            const tTitle = document.getElementById('statusTitle');
            const tMsg = document.getElementById('statusMsg');
            
            toast.className = `scan-status active fixed top-6 left-1/2 z-[100] w-[88%] max-w-sm p-4 rounded-2xl shadow-2xl border-2 flex items-center gap-4 ${success ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-red-600 border-red-400 text-white'}`;
            icon.className = `w-11 h-11 rounded-full flex items-center justify-center shrink-0 bg-white/20`;
            icon.innerHTML = `<span class="material-symbols-outlined text-2xl">${success ? 'verified' : 'report'}</span>`;
            tTitle.innerText = title;
            tMsg.innerText = msg;

            setTimeout(() => { toast.classList.remove('active'); }, 3000);
        }

        let scannerMode = 'MASUK';
        let statusAbsen = 'HADIR';
        let selectedKegiatanId = '';

        function setScannerMode(mode) {
            scannerMode = mode;
            const btnMasuk = document.getElementById('modeMasuk');
            const btnSelesai = document.getElementById('modeSelesai');
            if (!btnMasuk || !btnSelesai) return;
            
            if (mode === 'MASUK') {
                btnMasuk.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm text-center flex items-center justify-center gap-2 transition-all bg-emerald-600 text-white shadow-md";
                btnSelesai.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm text-center flex items-center justify-center gap-2 transition-all bg-white text-gray-500 hover:text-gray-700 border border-gray-200";
            } else {
                btnSelesai.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm text-center flex items-center justify-center gap-2 transition-all bg-emerald-600 text-white shadow-md";
                btnMasuk.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm text-center flex items-center justify-center gap-2 transition-all bg-white text-gray-500 hover:text-gray-700 border border-gray-200";
            }
        }

        function setStatusAbsen(sts) {
            statusAbsen = sts;
            const btnHadir = document.getElementById('statusHadir');
            const btnIzin = document.getElementById('statusIzin');
            const wrapIzin = document.getElementById('ketIzinWrapper');
            if (!btnHadir || !btnIzin) return;
            
            if (sts === 'HADIR') {
                btnHadir.className = "px-5 py-2.5 rounded-xl font-bold text-xs bg-emerald-600 text-white shadow-sm";
                btnIzin.className = "px-5 py-2.5 rounded-xl font-bold text-xs bg-white text-gray-500 border border-gray-200";
                if (wrapIzin) wrapIzin.classList.add('hidden');
            } else {
                btnIzin.className = "px-5 py-2.5 rounded-xl font-bold text-xs bg-amber-500 text-white shadow-sm";
                btnHadir.className = "px-5 py-2.5 rounded-xl font-bold text-xs bg-white text-gray-500 border border-gray-200";
                if (wrapIzin) wrapIzin.classList.remove('hidden');
            }
        }

        let html5QrCode;
        let isScanning = false;
        let isProcessing = false;

        function startScanner() {
            const btn = document.getElementById('btnStart');
            if (isScanning) {
                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        isScanning = false;
                        btn.innerHTML = '<span class="material-symbols-outlined">qr_code_scanner</span> Mulai Scanner';
                        btn.className = 'w-full bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 active:scale-95';
                    }).catch(err => console.error(err));
                }
                return;
            }

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                onScanFailure
            ).then(() => {
                isScanning = true;
                btn.innerHTML = '<span class="material-symbols-outlined">stop</span> Hentikan Scanner';
                btn.className = 'w-full bg-red-600 text-white py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 active:scale-95';
            }).catch(err => {
                showStatus(false, 'Gagal Membuka Kamera', 'Pastikan izin kamera sudah diberikan.');
            });
        }

        function onScanFailure(error) {}

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;
            processBarcode(decodedText);
            setTimeout(() => { isProcessing = false; }, 2000);
        }

        function processManual() {
            const input = document.getElementById('manualInput');
            if (!input || !input.value.trim()) return;
            processBarcode(input.value.trim());
            input.value = '';
        }

        function processBarcode(code) {
            const kegiatanId = document.getElementById('kegiatanSelect') ? document.getElementById('kegiatanSelect').value : '';
            const ketIzin = document.getElementById('ketIzin') ? document.getElementById('ketIzin').value : '';

            google.script.run
                .withSuccessHandler(res => {
                    if (res && res.success) {
                        showStatus(true, res.message, res.nama ? `${res.nama} (${res.cabang || res.kafilah || ''})` : '');
                    } else {
                        showStatus(false, 'Gagal Presensi', res ? res.message : 'Peserta tidak ditemukan atau kegiatan belum dipilih.');
                    }
                })
                .withFailureHandler(err => {
                    showStatus(false, 'Kesalahan Jaringan', 'Periksa koneksi server Anda.');
                })
                .prosesScan({
                    barcode: code,
                    kegiatanId: kegiatanId,
                    jenisAbsen: scannerMode,
                    statusKehadiran: statusAbsen,
                    keterangan: ketIzin
                });
        }

        let currentPage = 'dashboard';

        function navigate(page) {
            if (isScanning && html5QrCode) {
                html5QrCode.stop().then(() => { isScanning = false; }).catch(() => {});
            }
            currentPage = page;
            renderPage();
        }

        function renderPage() {
            const app = document.getElementById('app');
            const pageFn = PAGES[currentPage] || PAGES.dashboard;
            app.innerHTML = pageFn();
            
            if (currentPage === 'dashboard') initDashboard();
            if (currentPage === 'kegiatan') initKegiatan();
            if (currentPage === 'peserta') initPeserta();
            if (currentPage === 'scanner') initScannerPage();
            if (currentPage === 'hadir') initDaftarHadir();
            if (currentPage === 'laporan') initLaporan();
        }

        function logout() {
            currentPage = 'login';
            renderPage();
        }

        window.onload = () => {
            renderPage();
        };
    </script>
</body>
</html>
